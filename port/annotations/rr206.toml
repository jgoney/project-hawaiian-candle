# Code entry points and jump tables for RR206 that control-flow discovery
# cannot find by itself. Addresses only; no ROM bytes.
#
# How each indirect site was resolved is recorded in analysis/code-discovery.md.
# [jump_tables] must stay the last section: rr2-annotate-indirect regenerates it.

entries = [
    # Exception vector targets (verified: analysis/memory-map.md, rr2-rom-info --all-vectors).
    0x000200, # reset
    0x001424, 0x001432, 0x001440, 0x00144E, 0x00145C, 0x00146A,
    0x001478, 0x001486, 0x001494, 0x0014A2, 0x0014B0,
    0x0014BE, # level 4, HBlank
    0x0011B8, # level 6, VBlank
    # Callbacks installed through the frame callback slot 0xFF0300.
    0x00035A, # boot callback (verified: analysis/initial-findings.md, reset path step 5)
    0x00E038, # in-race VBlank callback (verified: analysis/bike-physics.md)
    # Front-end state loop (mechanics verified: analysis/initial-findings.md).
    0x0CBCC8,
]

# RAM addresses that hold code pointers. The immediate of any
# `move.l #imm,<slot>` is code.
callback_slots = [
    0xFF0300, # frame callback, called by the VBlank handler at 0x11DC
    0xFFF97A, # filled from the table at 0x52F8 by the front-end dispatcher at 0xCBDDC
]

# Routines that take a code pointer in A0 and store it in 0xFFF2C2, from where it
# is copied to the frame callback slot and jumped to at 0x1420. The immediate of
# a `movea.l #imm,a0` directly before a call to one of these is code.
callback_registrars = [0x0011E4, 0x001224]

[[pointer_tables]]
address = 0x01EEA4
count = 13
kind = "long"
sites = [0x018D6E, 0x018EB4]
note = "13 code pointers; entry 14 is a small integer, the start of the data that follows"

[[pointer_tables]]
address = 0x0CC274
count = 4
kind = "long"
sites = [0x0CBDEE]
note = "front-end state handlers; entry 5 is not a code address and packed data follows"

[[pointer_tables]]
address = 0x0052F8
count = 4
kind = "long"
note = "parallel to 0xCC274, copied to the callback slot 0xFFF97A; three entries are null"

[[pointer_tables]]
address = 0x02C418
count = 28
kind = "long_offset"
base = 0x02BCA4
sites = [0x02C416]
note = "offsets from 0x2BCA4; entry 29 is the first instruction after the table"

[[pointer_tables]]
address = 0x02747E
count = 16
kind = "long"
stride = 8
sites = [0x019D1C]
note = "16 eight-byte records, pointer first; record 17 does not start with a code address"

[[pointer_tables]]
address = 0x027546
count = 154
kind = "long"
sites = [0x019A26, 0x019BCC, 0x01F820]
note = "154 handler pointers used by vehicle behaviour records; unrelated data begins at 0x277AE"

